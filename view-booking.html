<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View Booking - Premium Bookings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://elfsightcdn.com https://static.elfsight.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://static.elfsight.com;
        img-src 'self' data: https://static.elfsight.com;
        font-src 'self' https://fonts.gstatic.com https://static.elfsight.com;
        connect-src 'self' https://apps.elfsight.com https://elfsight.com wss://socket.elfsight.com;
        frame-src 'self' https://apps.elfsight.com;
    ">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        secondary: '#0ea5e9',
                        accent: '#f59e0b',
                        success: '#10b981',
                        warning: '#f59e0b',
                        error: '#ef4444'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        * { font-family: 'Inter', sans-serif; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { background: white; border-radius: 0.75rem; box-shadow: 0 10px 15px rgba(0,0,0,0.1); padding: 1.5rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-gray-50 pt-20">
    <header class="fixed top-0 left-0 right-0 bg-white shadow z-50">
        <div class="container mx-auto px-6">
            <div class="flex items-center justify-between py-4">
                <a href="index.html" class="flex items-center space-x-2 text-2xl font-bold text-gray-800">
                    <span>GPlus Elevator</span>
                </a>
                <nav class="hidden md:flex space-x-6 text-gray-700 font-semibold">
                    <a href="index.html" class="hover:text-primary transition-colors">Home</a>
                    <a href="videos.html" class="hover:text-primary transition-colors">Videos</a>
                    <a href="pictures.html" class="hover:text-primary transition-colors">Gallery</a>
                    <a href="documents.html" class="hover:text-primary transition-colors">Documents</a>
                    <a href="fabrication.html" class="hover:text-primary transition-colors">Fabrication</a>
                    <a href="chatbot.html" class="hover:text-primary transition-colors">Chatbot</a>
                    <a href="booking.html" class="hover:text-primary transition-colors">Booking</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-12 max-w-4xl">
        <h1 class="text-4xl font-bold mb-8 text-center">Your Latest Booking</h1>
        <div id="bookingDetails" class="text-gray-800">
            <!-- Booking details will be rendered here -->
        </div>
    </main>

    <footer>
        <p>&copy; <span id="copyright-year"></span> GPlus Elevator. All Rights Reserved.</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const bookingDetailsDiv = document.getElementById('bookingDetails');
            const bookingDataJSON = localStorage.getItem('latestBooking');
            if (!bookingDataJSON) {
                bookingDetailsDiv.innerHTML = '<p class="text-center text-lg text-gray-600">No booking data found. Please make a booking first.</p>';
                return;
            }
            const bookingData = JSON.parse(bookingDataJSON);

            const formatDate = (dateStr) => {
                const options = { year: 'numeric', month: 'long', day: 'numeric' };
                const date = new Date(dateStr);
                return date.toLocaleDateString(undefined, options);
            };

            const bookingHTML = `
                <div class="card">
                    <h2 class="text-2xl font-semibold mb-4">Booking Details</h2>
                    <p><strong>Full Name:</strong> ${bookingData.fullName || ''}</p>
                    <p><strong>Email:</strong> ${bookingData.email || ''}</p>
                    <p><strong>Phone:</strong> ${bookingData.phone || ''}</p>
                    <p><strong>Number of Guests:</strong> ${bookingData.guests || ''}</p>
                    <p><strong>Service Type:</strong> ${bookingData.service || ''}</p>
                    <p><strong>Preferred Date:</strong> ${bookingData.date ? formatDate(bookingData.date) : ''}</p>
                    <p><strong>Preferred Time:</strong> ${bookingData.time || ''}</p>
                    <p><strong>Duration:</strong> ${bookingData.duration || ''}</p>
                    <p><strong>Special Requests:</strong> ${bookingData.requests || 'None'}</p>
                </div>
            `;
            bookingDetailsDiv.innerHTML = bookingHTML;
        });

        // Set current year in footer
        document.getElementById('copyright-year').textContent = new Date().getFullYear();
    </script>

    <!-- Elfsight Widgets -->
    <div class="elfsight-app-24420b3f-8654-4722-a54e-7939522123e2" data-elfsight-app-lazy></div>
    <div class="elfsight-app-5b01b9ba-c037-4e27-b055-748d09afae5d" data-elfsight-app-lazy></div>
    <script src="https://elfsightcdn.com/platform.js" data-use-service-core defer></script>
</body>
</html>

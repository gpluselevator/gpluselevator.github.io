    <style>
      main {
        column-count: 1;
        column-gap: 1rem;
        padding: 1rem 2rem;
        max-width: 900px;
        margin: auto;
      }

      @media (min-width: 768px) {
        main {
          column-count: 2;
        }
      }

      .video-section {
        background: #F9FBFC;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        display: inline-block;
        width: 100%;
        break-inside: avoid;
      }

      .video-title {
        cursor: pointer;
        background-color: #1E2A47;
        color: white;
        padding: 0.8rem 1rem;
        border: none;
        width: 100%;
        text-align: left;
        font-size: 1.1rem;
        border-radius: 5px;
        transition: background-color 0.3s;
        font-weight: 600;
        letter-spacing: 0.5px;
      }

      .video-title:hover {
        background-color: #3A6EA5;
      }

      .video-container {
        overflow: hidden;
        max-height: 0;
        transition: max-height 0.5s ease, padding 0.3s ease;
        padding: 0 0;
      }

      .video-container.open {
        padding: 1rem 0;
        max-height: 1000px;
      }

      iframe {
        width: 100%;
        height: auto;
        aspect-ratio: 9 / 16;
        border: none;
      }

      #close-all-btn {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #D25A07;
        color: white;
        border: none;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        border-radius: 5px;
        cursor: pointer;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        z-index: 1000;
      }

      #close-all-btn.show {
        opacity: 1;
        visibility: visible;
      }

      /* Styles for the featured video player */
      .video-player-container {
        position: relative;
        width: 100%;
        max-width: 800px;
        margin: 2rem auto;
        background: #000;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }
      .video-wrapper {
        position: relative;
        padding-bottom: 56.25%; /* 16:9 aspect ratio */
        height: 0;
      }
      .video-wrapper iframe {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: none;
      }
      .video-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: rgba(0, 0, 0, 0.7);
        padding: 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: opacity 0.3s ease;
      }
      .control-btn {
        background: transparent;
        border: none;
        color: white;
        cursor: pointer;
        padding: 5px;
        font-size: 1.2rem;
        transition: transform 0.2s ease;
      }
      .control-btn:hover {
        transform: scale(1.1);
      }
      .progress-bar {
        flex: 1;
        height: 5px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 5px;
        cursor: pointer;
        overflow: hidden;
      }
      .progress {
        height: 100%;
        background: #3A6EA5;
        width: 0;
        transition: width 0.1s linear;
      }
      @media (max-width: 768px) {
        .video-player-container { margin: 1rem auto; }
        .video-controls { padding: 8px; }
        .control-btn { font-size: 1rem; }
      }
    </style>

      ];

      function pauseYouTubeVideo(iframe) {
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        }
      }

      function createVideoSection(video) {
        const section = document.createElement('div');
        section.className = 'video-section';

        const title = document.createElement('button');
        title.className = 'video-title';
        title.textContent = video.title;

        const videoContainer = document.createElement('div');
        videoContainer.className = 'video-container';

        title.addEventListener('click', () => {
          const wasOpen = videoContainer.classList.contains('open');
          // Close all other videos
          document.querySelectorAll('.video-container.open').forEach(openContainer => {
            if (openContainer !== videoContainer) {
                openContainer.classList.remove('open');
                pauseYouTubeVideo(openContainer.querySelector('iframe'));
            }
          });
          // Toggle the clicked video
          if (!wasOpen) {
            videoContainer.classList.add('open');
            // Lazy load iframe
            if (!videoContainer.querySelector('iframe')) {
              const iframe = document.createElement('iframe');
              iframe.src = video.url;
              iframe.title = video.title;
              iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
              iframe.allowFullscreen = true;
              videoContainer.appendChild(iframe);
            }
          } else {
            videoContainer.classList.remove('open');
            pauseYouTubeVideo(videoContainer.querySelector('iframe'));
          }
          updateCloseAllButtonVisibility();
        });

        section.appendChild(title);
        section.appendChild(videoContainer);
        return section;
      }

      function updateCloseAllButtonVisibility() {
        const anyOpen = Array.from(document.querySelectorAll('.video-container')).some(container => container.classList.contains('open'));
        if (anyOpen) {
          closeAllBtn.classList.add('show');
        } else {
          closeAllBtn.classList.remove('show');
        }
      }

      closeAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.video-container.open').forEach(container => {
          container.classList.remove('open');
          const iframe = container.querySelector('iframe');
          pauseYouTubeVideo(iframe);
        });
        updateCloseAllButtonVisibility();
      });

      document.addEventListener('DOMContentLoaded', () => {
        // 1. Create the collapsible list from the static video array
        staticVideos.forEach(video => {
          const videoSection = createVideoSection(video);
          container.appendChild(videoSection);
        });

        // 2. Create the continuous playlist for the main player
        const getVideoId = (url) => {
            const match = url.match(/embed\/([^?]+)/);
            return match ? match[1] : null;
        };
        
        // A separate, longer list for the main player's continuous playlist
        const playerPlaylistVideos = staticVideos; // Use the full list of 16 videos
        const allVideoIds = [...new Set(playerPlaylistVideos.map(video => getVideoId(video.url)).filter(id => id))];

        if (allVideoIds.length > 0) {
          const playlistString = allVideoIds.join(',');
          activeVideoIframe.src = `https://www.youtube.com/embed/${allVideoIds[0]}?enablejsapi=1&playlist=${playlistString}`;
        }
      });
    </script>
